name: CI - SqlPackage Publisher

on:
  push:
    branches:
      - develop
    paths:
      - 'src/Services/Task.SqlPackage.Publisher/**'
      - '.github/workflows/ci-publisher.yml'
      - '.github/workflows/cd-publisher.yml'
  pull_request:
    paths:
      - 'src/Services/Task.SqlPackage.Publisher/**'
      - '.github/workflows/ci-publisher.yml'
      - '.github/workflows/cd-publisher.yml'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/Services/Task.SqlPackage.Publisher/package-lock.json

    - name: Install dependencies
      working-directory: src/Services/Task.SqlPackage.Publisher
      run: npm ci

    - name: Lint code
      working-directory: src/Services/Task.SqlPackage.Publisher
      run: npm run lint

    - name: Run tests
      working-directory: src/Services/Task.SqlPackage.Publisher
      run: npm run test:coverage

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ./src/Services/Task.SqlPackage.Publisher/coverage/lcov.info
        flag-name: publisher-unittests
        parallel: false

    - name: Build extension
      working-directory: src/Services/Task.SqlPackage.Publisher
      run: npm run build

    - name: Create VSIX package
      working-directory: src/Services/Task.SqlPackage.Publisher
      run: npm run package

    - name: Restore modules (cleanup)
      working-directory: src/Services/Task.SqlPackage.Publisher
      run: npm run restore-modules
      if: always()

    - name: Get extension version
      id: get_version
      working-directory: src/Services/Task.SqlPackage.Publisher
      shell: pwsh
      run: |
        $manifest = Get-Content vss-extension.json | ConvertFrom-Json
        $version = $manifest.version
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Extension version: $version"
        Set-Content -Path release-version.txt -Value $version

    # Artifacts are always produced, including for pull requests; CD consumes them
    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v7
      with:
        name: publisher-vsix-package
        path: |
          src/Services/Task.SqlPackage.Publisher/*.vsix
          src/Services/Task.SqlPackage.Publisher/release-version.txt
        retention-days: 30

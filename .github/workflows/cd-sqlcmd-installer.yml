name: CD - SqlCmd Installer

# Creates the GitHub release from the VSIX built by the matching CI workflow, then publishes
# that same VSIX to the Marketplace. Afterwards the minor version is bumped on develop
# so the next run publishes a new version.
# It never runs for pull request builds.
on:
  workflow_run:
    workflows: ['CI - SqlCmd Installer']
    types: [completed]
    branches:
      - develop
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID of a successful, non pull request CI run whose VSIX should be published'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: cd-sqlcmd-installer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}

    steps:
    - name: Verify CI run is not a pull request run
      shell: pwsh
      run: |
        $event = gh run view $env:RUN_ID --repo "${{ github.repository }}" --json event,workflowName,conclusion --jq '.event + "|" + .workflowName + "|" + .conclusion'
        if ($LASTEXITCODE -ne 0) { echo "::error::Unable to read CI run $env:RUN_ID"; exit 1 }
        $parts = $event -split '\|'
        if ($parts[0] -eq 'pull_request') { echo "::error::Run $env:RUN_ID is a pull request run - publishing is not allowed"; exit 1 }
        if ($parts[1] -ne 'CI - SqlCmd Installer') { echo "::error::Run $env:RUN_ID belongs to workflow '$($parts[1])', not 'CI - SqlCmd Installer'"; exit 1 }
        if ($parts[2] -ne 'success') { echo "::error::Run $env:RUN_ID did not succeed"; exit 1 }
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Download CI artifact
      uses: actions/download-artifact@v8
      with:
        name: sqlcmd-installer-vsix-package
        run-id: ${{ env.RUN_ID }}
        github-token: ${{ github.token }}

    - name: Read version
      id: get_version
      shell: pwsh
      run: |
        $version = (Get-Content release-version.txt -Raw).Trim()
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: sqlcmd-installer-v${{ steps.get_version.outputs.version }}
        name: SqlCmd Installer v${{ steps.get_version.outputs.version }}
        target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
        body: |
          Automated release of SqlCmd Installer from develop branch

          Extension version: ${{ steps.get_version.outputs.version }}

          This extension installs sqlcmd and adds it to the PATH for use in subsequent pipeline steps.
        files: '*.vsix'
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to Marketplace
      env:
        AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
      run: |
        if ([string]::IsNullOrEmpty($env:AZURE_DEVOPS_PAT)) {
          echo "::error::AZURE_DEVOPS_PAT secret is not configured. Please add it to repository secrets."
          echo "::error::Visit: https://github.com/${{ github.repository }}/settings/secrets/actions"
          exit 1
        }
        echo "::notice::Publishing SqlCmd Installer extension to Azure DevOps Marketplace..."
        npx tfx-cli extension publish --vsix (Get-ChildItem -Filter *.vsix | Select-Object -First 1).Name --token $env:AZURE_DEVOPS_PAT --no-prompt --no-wait-validation
        if ($LASTEXITCODE -ne 0) {
          echo "::error::Failed to publish SqlCmd Installer extension to marketplace"
          exit 1
        }
        echo "::notice::Uploaded SqlCmd Installer to marketplace; validation continues in the validate job"
      shell: pwsh

  # The Marketplace validates uploads asynchronously and can take a long time, so publishing does not wait for it.
  # A rejected extension fails this job; a validation that is still pending after the timeout only warns.
  validate:
    runs-on: ubuntu-latest
    needs: publish
    env:
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
    - name: Download CI artifact
      uses: actions/download-artifact@v8
      with:
        name: sqlcmd-installer-vsix-package
        run-id: ${{ env.RUN_ID }}
        github-token: ${{ github.token }}

    - name: Wait for Marketplace validation
      shell: pwsh
      timeout-minutes: 45
      env:
        AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
      run: |
        $vsix = (Get-ChildItem -Filter *.vsix | Select-Object -First 1).Name
        $deadline = (Get-Date).AddMinutes(30)
        while ((Get-Date) -lt $deadline) {
          $output = (npx tfx-cli extension isvalid --vsix $vsix --token $env:AZURE_DEVOPS_PAT --no-prompt --json 2>$null) -join "`n"
          $status = if ($output -match '"status"\s*:\s*"(\w+)"') { $Matches[1] } else { 'unknown' }
          echo "Validation status: $status"
          if ($status -eq 'success') {
            echo "::notice::SqlCmd Installer passed Marketplace validation"
            exit 0
          }
          if ($status -eq 'error') {
            echo "::error::SqlCmd Installer was rejected by Marketplace validation: $output"
            exit 1
          }
          Start-Sleep -Seconds 30
        }
        echo "::warning::Marketplace validation of SqlCmd Installer is still pending after 30 minutes. It will become available once validation completes."

  # Bumps the minor version on develop so the next run does not republish this one.
  # Commits made with GITHUB_TOKEN do not trigger other workflows, so this cannot loop.
# Automatic version bump disabled temporarily (develop ruleset requires PRs); bump versions manually.

name: Build and Publish SqlPackage Publisher

on:
  push:
    branches:
      - develop
    paths:
      - 'src/Services/Task.SqlPackage.Publisher/**'
      - '.github/workflows/publish-publisher.yml'
  pull_request:
    paths:
      - 'src/Services/Task.SqlPackage.Publisher/**'
      - '.github/workflows/publish-publisher.yml'
  workflow_dispatch: # Allows manual trigger
    inputs:
      force_publish:
        description: 'Force publish even if version unchanged'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/Services/Task.SqlPackage.Publisher/package-lock.json

    - name: Install dependencies
      working-directory: src/Services/Task.SqlPackage.Publisher
      run: npm ci

    - name: Lint code
      working-directory: src/Services/Task.SqlPackage.Publisher
      run: npm run lint

    - name: Run tests
      working-directory: src/Services/Task.SqlPackage.Publisher
      run: npm run test:coverage

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ./src/Services/Task.SqlPackage.Publisher/coverage/lcov.info
        flag-name: publisher-unittests
        parallel: false

    - name: Build extension
      working-directory: src/Services/Task.SqlPackage.Publisher
      run: npm run build

    - name: Create VSIX package
      working-directory: src/Services/Task.SqlPackage.Publisher
      run: npm run package

    - name: Restore modules (cleanup)
      working-directory: src/Services/Task.SqlPackage.Publisher
      run: npm run restore-modules
      if: always()

    - name: Get extension version
      id: get_version
      working-directory: src/Services/Task.SqlPackage.Publisher
      shell: pwsh
      run: |
        $manifest = Get-Content vss-extension.json | ConvertFrom-Json
        $version = $manifest.version
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Extension version: $version"

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: publisher-vsix-package
        path: src/Services/Task.SqlPackage.Publisher/*.vsix
        retention-days: 30

  publish:
    runs-on: windows-latest
    needs: build
    if: github.ref == 'refs/heads/develop'

    steps:
    - name: Check if version changed
      id: version_check
      shell: pwsh
      run: |
        try {
          # Get the latest release version from GitHub for Publisher
          echo "Checking for existing Publisher releases..."
          $latestRelease = gh release list --json tagName,name --jq '.[] | select(.name | contains("Publisher")) | .tagName' | Select-Object -First 1 2>&1
          $ghExitCode = $LASTEXITCODE

          if ($ghExitCode -eq 0 -and $latestRelease) {
            $latestVersion = $latestRelease -replace '^publisher-v', ''
            $currentVersion = "${{ needs.build.outputs.version }}"

            echo "::notice::Latest published Publisher version: $latestVersion"
            echo "::notice::Current Publisher version: $currentVersion"

            # Use string comparison - we only care if versions are exactly equal
            if ($latestVersion -eq $currentVersion -and "${{ github.event.inputs.force_publish }}" -ne "true") {
              echo "::notice::Version unchanged ($currentVersion) - skipping publish"
              echo "SKIP_PUBLISH=true" >> $env:GITHUB_ENV
            } else {
              echo "::notice::Version changed from $latestVersion to $currentVersion - will publish"
              echo "SKIP_PUBLISH=false" >> $env:GITHUB_ENV
            }
          } else {
            # No releases yet, allow publishing
            echo "::notice::No previous Publisher releases found - will publish version ${{ needs.build.outputs.version }}"
            echo "SKIP_PUBLISH=false" >> $env:GITHUB_ENV
          }

          # Explicitly exit successfully
          exit 0
        } catch {
          # If there's an error checking releases, fail the workflow
          echo "::error::Failed to check releases: $_"
          exit 1
        }
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Download VSIX artifact
      if: env.SKIP_PUBLISH != 'true'
      uses: actions/download-artifact@v4
      with:
        name: publisher-vsix-package

    - name: Publish to Marketplace
      if: env.SKIP_PUBLISH != 'true'
      env:
        AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
      run: |
        if ([string]::IsNullOrEmpty($env:AZURE_DEVOPS_PAT)) {
          echo "::error::AZURE_DEVOPS_PAT secret is not configured. Please add it to repository secrets."
          echo "::error::Visit: https://github.com/${{ github.repository }}/settings/secrets/actions"
          exit 1
        }
        echo "::notice::Publishing Publisher extension to Azure DevOps Marketplace..."
        npx tfx-cli extension publish --vsix (Get-ChildItem -Filter *.vsix | Select-Object -First 1).Name --token $env:AZURE_DEVOPS_PAT --no-prompt
        if ($LASTEXITCODE -ne 0) {
          echo "::error::Failed to publish Publisher extension to marketplace"
          exit 1
        }
        echo "::notice::Successfully published Publisher to marketplace"
      shell: pwsh

    - name: Create GitHub Release
      if: env.SKIP_PUBLISH != 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: publisher-v${{ needs.build.outputs.version }}
        name: SqlPackage Publisher v${{ needs.build.outputs.version }}
        body: |
          Automated release of SqlPackage Publisher from develop branch

          Extension version: ${{ needs.build.outputs.version }}

          This extension deploys DACPAC files using SqlPackage with support for multiple authentication methods.
        files: '*.vsix'
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/src/Services/Task.SqlPackage.Installer"
      - "/src/Services/Task.SqlPackage.Publisher"
      - "/src/Services/Task.SqlCmd.Installer"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
      npm-major:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"

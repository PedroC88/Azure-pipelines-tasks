<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0078D4" opacity="0.1"/>

  <!-- Database cylinder (body) - drawn first -->
  <rect x="32" y="35" width="64" height="35" fill="#0078D4"/>

  <!-- Database cylinder (bottom ellipse) -->
  <ellipse cx="64" cy="70" rx="32" ry="10" fill="#0078D4"/>

  <!-- Database cylinder (top ellipse) - drawn on top to cover body -->
  <ellipse cx="64" cy="35" rx="32" ry="10" fill="#0078D4"/>

  <!-- Database cylinder highlights -->
  <ellipse cx="64" cy="35" rx="32" ry="10" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <path d="M 32 35 L 32 70" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
  <path d="M 96 35 L 96 70" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
  <ellipse cx="64" cy="70" rx="32" ry="10" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>

  <!-- SQL text label - centered in cylinder -->
  <text x="64" y="62" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SQL</text>

  <!-- Package/Download icon -->
  <g transform="translate(70, 75)">
    <!-- Box -->
    <rect x="0" y="0" width="36" height="36" rx="4" fill="#D2B48C" stroke="#8B7355" stroke-width="2"/>

    <!-- Download arrow -->
    <path d="M 18 8 L 18 20" stroke="#8B7355" stroke-width="3" stroke-linecap="round"/>
    <path d="M 12 16 L 18 22 L 24 16" fill="none" stroke="#8B7355" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Base line -->
    <path d="M 8 28 L 28 28" stroke="#8B7355" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
